<!DOCTYPE html>
<html>
  <head>
    <title>Superset + Chat Demo</title>
    <!-- Load Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
      /* Chat widget overlay */
      #n8n-chat {
        position: fixed !important;
        bottom: 20px !important;
        right: 20px !important; /* Align to bottom-right */
        z-index: 9999 !important; /* ensures it's above iframe */
      }

      /* Additional styling to ensure chat widget displays properly */
      #n8n-chat .chat-widget {
        position: relative !important;
      }

      /* Override chat widget font family */
      #n8n-chat,
      #n8n-chat *,
      #n8n-chat .chat-widget,
      #n8n-chat .chat-widget *,
      .n8n-chat,
      .n8n-chat * {
        font-family: Inter, Helvetica, Arial, sans-serif !important;
      }

      /* Custom floating bubble styling - only for the main toggle button */
      #n8n-chat [class*="toggle"]:not([class*="chat-window"] [class*="toggle"]),
      #n8n-chat [class*="fab"]:not([class*="chat-window"] [class*="fab"]),
      #n8n-chat
        [class*="trigger"]:not([class*="chat-window"] [class*="trigger"]),
      .n8n-chat [class*="toggle"]:not([class*="chat-window"] [class*="toggle"]),
      .n8n-chat [class*="fab"]:not([class*="chat-window"] [class*="fab"]),
      .n8n-chat
        [class*="trigger"]:not([class*="chat-window"] [class*="trigger"]) {
        background-image: url("diamond.jpg") !important;
        background-size: 40px 40px !important;
        background-repeat: no-repeat !important;
        background-position: center !important;
        border-radius: 16px !important;
        width: 56px !important;
        height: 56px !important;
        border: none !important;
        position: relative !important;
        overflow: hidden !important;
      }

      /* Target specific chat-window-toggle element */
      #n8n-chat .chat-window-toggle,
      .n8n-chat .chat-window-toggle {
        background-image: url("diamond.jpg") !important;
        background-size: 36px 36px !important;
        background-repeat: no-repeat !important;
        background-position: center !important;
        border-radius: 30px !important;
        width: 80px !important;
        height: 80px !important;
        border: none !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
      }

      /* Hide the SVG inside chat-window-toggle */
      #n8n-chat .chat-window-toggle svg,
      .n8n-chat .chat-window-toggle svg {
        display: none !important;
      }

      /* Hide existing icons only on floating button */
      #n8n-chat
        [class*="toggle"]:not([class*="chat-window"] [class*="toggle"])
        svg,
      #n8n-chat
        [class*="toggle"]:not([class*="chat-window"] [class*="toggle"])
        img,
      #n8n-chat [class*="fab"]:not([class*="chat-window"] [class*="fab"]) svg,
      #n8n-chat [class*="fab"]:not([class*="chat-window"] [class*="fab"]) img,
      .n8n-chat
        [class*="toggle"]:not([class*="chat-window"] [class*="toggle"])
        svg,
      .n8n-chat
        [class*="toggle"]:not([class*="chat-window"] [class*="toggle"])
        img,
      .n8n-chat [class*="fab"]:not([class*="chat-window"] [class*="fab"]) svg,
      .n8n-chat [class*="fab"]:not([class*="chat-window"] [class*="fab"]) img {
        display: none !important;
      }

      /* Custom chat header styling */
      #n8n-chat .chat-header,
      .n8n-chat .chat-header {
        background-color: #6dc7df !important;
        padding: 20px 16px 0 16px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        border-radius: 16px 16px 0 0 !important;
      }

      #n8n-chat .chat-window-toggle {
        background-color: #6dc7df !important;
      }

      /* Hide all text in chat header */
      #n8n-chat .chat-header *,
      .n8n-chat .chat-header * {
        color: transparent !important;
        font-size: 0 !important;
        text-indent: -9999px !important;
      }

      /* Add RHB Bank logo image */
      #n8n-chat .chat-header::before,
      .n8n-chat .chat-header::before {
        content: "" !important;
        display: block !important;
        width: 120px !important;
        height: 32px !important;
        background-image: url("rhblogo.png") !important;
        background-size: contain !important;
        background-repeat: no-repeat !important;
        background-position: center !important;
        position: relative !important;
      }

      /* Enhanced features - minimal styling */
      #n8n-chat .enhanced-voice-button {
        background: #28a745 !important;
        border: none !important;
        color: white !important;
        border-radius: 50% !important;
        width: 36px !important;
        height: 36px !important;
        cursor: pointer !important;
        font-size: 14px !important;
        margin-left: 8px !important;
      }

      #n8n-chat .enhanced-voice-button:hover {
        background: #218838 !important;
      }

      #n8n-chat .enhanced-voice-button.recording {
        background: #dc3545 !important;
        animation: pulse 1s infinite !important;
      }

      @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.7; }
        100% { opacity: 1; }
      }

      #n8n-chat .enhanced-alert-mode-btn {
        background: #6c757d !important;
        color: white !important;
        border: none !important;
        border-radius: 6px !important;
        padding: 6px 10px !important;
        font-size: 11px !important;
        cursor: pointer !important;
        margin: 4px 0 !important;
        width: 100% !important;
      }

      #n8n-chat .enhanced-alert-mode-btn.active {
        background: #dc3545 !important;
      }
    </style>
  </head>
  <body>
    <!-- Superset inside iframe -->
    <iframe src="/superset/welcome/"></iframe>

    <!-- Chat widget container -->
    <div id="n8n-chat"></div>

    <script>
      // Skip CDN CSS entirely - we'll handle styling in enhanced-script.js
      console.log('Skipping CDN CSS to avoid problematic selectors');
      
      // Initialize chat directly without CDN CSS
      const scriptElement = document.createElement("script");
      scriptElement.type = "module";
      scriptElement.textContent = `
        import { createChat } from './enhanced-script.js';

        createChat({
          target: '#n8n-chat',
          // Production webhook:
          webhookUrl: '/webhook/9416569c-169b-45cf-b768-60082dd61349',
          // Test webhook (uncomment for testing):
          // webhookUrl: '/webhook-test/9416569c-169b-45cf-b768-60082dd61349',
          initialMessages: [
            'Hi there! Welcome to RHB MARiA Dashboard 👋',
            'I am Maria. How can I assist you today?'
          ],
          chatWindowConfig: {
            welcomeMessage: 'Hi there! Welcome to RHB 👋',
            getStarted: 'New Conversation',
            expandButtonText: 'Click to chat',
            closeButtonText: 'Close chat',
          },
          voiceEnabled: true,
          textToSpeechEnabled: true,
          autoPlayResponses: false,
          alertModeEnabled: true
        });
      `;
      document.body.appendChild(scriptElement);
    </script>
  </body>
</html>
